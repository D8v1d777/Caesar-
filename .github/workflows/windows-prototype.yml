name: Caesar prototype checks

on:
  pull_request:
    paths:
      - "apps/windows-prototype/**"
      - "services/api/**"
      - ".github/workflows/windows-prototype.yml"
  push:
    branches: ["main", "feat/windows-prototype-approval-loop"]
    paths:
      - "apps/windows-prototype/**"
      - "services/api/**"
      - ".github/workflows/windows-prototype.yml"

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/windows-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm test

  synthetic-api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
